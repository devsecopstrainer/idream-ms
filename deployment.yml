apiVersion: apps/v1
kind: Deployment
metadata:
  name: idream-ms-dep
  labels:
    app: idream-ms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: idream-ms
  template:
    metadata:
      labels:
        app: idream-ms
    spec:
      containers:
      - name: idream-ms
        image: devsecopstrainer/idream-ms:11
        ports:
        - containerPort: 8080
